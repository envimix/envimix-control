name: Publish Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ vars.DOCKERHUB_USERNAME }}/envimix-control
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: EnvimixControl
          file: EnvimixControl/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: |
            type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
            type=image,name=${{ vars.DOCKERHUB_USERNAME }}/envimix-control,push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        run: echo "${{ steps.build.outputs.digest }}" > "${{ runner.temp }}/digest"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digest
          retention-days: 1

  create-manifests:
    name: Create multi-architecture manifests
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ vars.DOCKERHUB_USERNAME }}/envimix-control
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and publish manifests
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          digests=()
          while IFS= read -r digest; do
            digests+=("$digest")
          done < <(find "${{ runner.temp }}/digests" -type f -name digest -exec cat {} \;)

          test "${#digests[@]}" -eq 2

          while IFS= read -r tag; do
            repository="${tag%:*}"
            docker buildx imagetools create \
              --tag "$tag" \
              "${repository}@${digests[0]}" \
              "${repository}@${digests[1]}"
          done <<< "$TAGS"

  update-dockerhub-description:
    name: Update Docker Hub description
    needs: create-manifests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Update Docker Hub description
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          login_payload=$(jq -n \
            --arg username "$DOCKERHUB_USERNAME" \
            --arg password "$DOCKERHUB_TOKEN" \
            '{ username: $username, password: $password }')

          jwt=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$login_payload" \
            https://hub.docker.com/v2/users/login/ | jq --exit-status --raw-output '.token')

          jq -n --rawfile description README.md \
            '{ full_description: $description }' > /tmp/dockerhub-description.json

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: JWT $jwt" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/dockerhub-description.json \
            https://hub.docker.com/v2/repositories/${{ vars.DOCKERHUB_USERNAME }}/envimix-control/
