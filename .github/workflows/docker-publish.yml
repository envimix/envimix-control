name: Docker Image Publish

on:
  push:
    branches: ["main", "dev"]
    paths:
      - ".github/workflows/docker-publish.yml"
      - "README.md"
      - "EnvimixControl/Dockerfile"
      - "EnvimixControl/**"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - ".github/workflows/docker-publish.yml"
      - "README.md"
      - "EnvimixControl/Dockerfile"
      - "EnvimixControl/**"
  schedule:
    - cron: "0 5 */7 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: envimix-control

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: EnvimixControl/Dockerfile
            platforms: linux/amd64,linux/arm64
            tags: |
              type=raw,value=latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: ${{ matrix.tags }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: EnvimixControl
          platforms: ${{ matrix.platforms }}
          file: ${{ matrix.dockerfile }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-dockerhub-description:
    name: Update Docker Hub Description
    needs: build-and-push
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update Docker Hub description
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          login_payload=$(jq -n \
            --arg username "$DOCKERHUB_USERNAME" \
            --arg password "$DOCKERHUB_TOKEN" \
            '{ username: $username, password: $password }')

          jwt=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$login_payload" \
            https://hub.docker.com/v2/users/login/ | jq --exit-status --raw-output '.token')

          jq -n --rawfile description README.md \
            '{ full_description: $description }' > /tmp/dockerhub-description.json

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: JWT $jwt" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/dockerhub-description.json \
            "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/$IMAGE_NAME/"
